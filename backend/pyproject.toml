[project]
name = "calibrate-ai"
version = "0.1.0"
description = "Open-source tool for calibrating LLM-based scoring against human evaluators"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "google-cloud-storage>=3.9.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.26",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "datasets>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # sklearn's QWK warns when bootstrap resampling lands on a single label;
    # not actionable from our side.
    "ignore::UserWarning:sklearn",
    "ignore::RuntimeWarning:sklearn",
]
